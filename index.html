<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ZM Planner</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<meta name="theme-color" content="#14532d">
<style>
:root{--bg:#eef2ee;--card:#fff;--tx:#18201a;--mut:#5d6b60;--pri:#14532d;--on:#fff;--acc:#b45309;--bd:#d3dcd4;--red:#b42318}
@media(prefers-color-scheme:dark){:root{--bg:#0f1511;--card:#18201a;--tx:#e8efe9;--mut:#9aa89d;--pri:#4ade80;--on:#06210f;--acc:#f0a45a;--bd:#2a362c;--red:#f87171}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 Georgia,'Times New Roman',serif;padding-bottom:84px}
header{background:var(--pri);color:var(--on);padding:14px 16px;font:700 20px system-ui,sans-serif;border-bottom:4px solid var(--acc)}
header small{display:block;font:400 13px system-ui,sans-serif;opacity:.85}
main{max-width:640px;margin:0 auto;padding:14px}
button,input,textarea{font:inherit}
button{border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:10px 14px;border-radius:8px;font-family:system-ui,sans-serif}
button.pri{background:var(--pri);color:var(--on);border-color:var(--pri);font-weight:600}
button.del{color:var(--red)}
button.link{border:0;background:none;color:var(--pri);padding:6px 0;font-weight:600}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--acc);outline-offset:1px}
.bar{display:flex;gap:8px;margin-bottom:12px}
.bar input{flex:1}
input,textarea,select{width:100%;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx)}
label{display:block;margin:12px 0;font:600 14px system-ui,sans-serif;color:var(--mut)}
label input,label textarea,label select{margin-top:4px;font:16px Georgia,serif;color:var(--tx)}
.card{background:var(--card);border:1px solid var(--bd);border-left:5px solid var(--acc);border-radius:8px;padding:12px 14px;margin-bottom:10px}
.card b{display:block}.card small{color:var(--mut);font-family:system-ui,sans-serif}
.empty{color:var(--mut);text-align:center;padding:30px 10px}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;border-radius:0;background:none;padding:14px 4px;color:var(--mut);font-weight:600;font-size:13px}
nav button.on{color:var(--pri);box-shadow:inset 0 3px 0 var(--acc)}
h3{margin:24px 0 4px;color:var(--pri);font:700 17px system-ui,sans-serif;border-bottom:2px solid var(--acc);padding-bottom:4px}
@media print{header,nav,.row,.bar,.link{display:none}body{background:#fff;color:#000}textarea,input{border:0;resize:none}}
</style></head><body>
<header>ZM Planner<small>Offline lesson planning for Zambian teachers</small><small id="dsg"></small><small id="pn"></small></header>
<main id="app"></main>
<nav>
<button data-t="plans">Plans</button>
<button data-t="scheme">Schemes</button>
<button data-t="lib">Library</button>
<button data-t="daniel">Daniel</button>
<button data-t="notes">Notes</button>
</nav>
<script>
const ST=[['eng','Engagement (Introduction)'],['exp','Exploration (Development)'],['xpl','Explanation (Conceptualization)'],['syn','Synthesis (Continuity and Extension)'],['evl','Evaluation and reflection (Conclusion)']];
const planF=[['h0','Preliminary information','h'],['school','School'],['teacher','Teacher'],['subject','Subject'],['cls','Level or class'],['concept','Concept'],['subc','Sub-concepts'],['topic','Topic'],['subtopic','Subtopic'],['dur','Lesson duration in minutes','number'],['time','Time (for example, 10:10 to 11:50)'],['date','Date','date'],['goal','Lesson goal','area'],['competences','Competences','area'],['target','Expected target competence','area'],['c1','Lesson competency 1 (knowledge based)','area'],['c2','Lesson competency 2 (cognitive based)','area'],['c3','Lesson competency 3 (skill based)','area'],['method','Lesson methodology and strategies','area'],['af','Formative assessment strategies','area'],['as','Summative assessment strategies','area'],['mat','Learning materials','area'],['env','Learning environment (natural, artificial, technological)','area'],['prior','Prior knowledge','area'],['inter','Interdisciplinary connections','area'],['h1','Lesson progression','h']];
ST.forEach(([k,l])=>planF.push(['h'+k,l,'h'],[k+'D','Duration in minutes','number'],[k+'T','Teacher activity (facilitator)','area'],[k+'L','Learner activity','area'],[k+'C','Targeted competency','area'],[k+'A','Assessment criteria','area']));
planF.push(['cont','Competence continuity and strategy','area']);
const S={
plans:{t:'Lesson plans',n:'lesson plan',k:'topic',m:'subject',f:planF},
scheme:{t:'Schemes of work',n:'scheme of work',k:'topic',m:'week',f:[['school','School'],['teacher','Teacher'],['cls','Class'],['subject','Subject'],['term','Term'],['week','Week (for example, Week 1)'],['topic','Topic'],['outcome','Specific outcomes','area'],['act','Activities','area'],['mat','Materials','area'],['assess','Assessment','area'],['rem','Remarks','area']]},
notes:{t:'Notes',n:'note',k:'title',m:'',f:[['title','Title'],['body','Note','area']]}
};
let D={plans:[],scheme:[],notes:[],lib:[],ct:[],pre:{}},tab='plans',cur=null,q='';
try{D=Object.assign(D,JSON.parse(localStorage.getItem('zmp')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('zmp',JSON.stringify(D))}catch(e){alert('Could not save on this phone. Free some storage and try again.')}};
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function render(){
 document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
 if(tab==='daniel')return daniel();
 if(tab==='lib')return cur===null?lib():libForm();
 cur===null?list():form();
}
function items(){
 const s=S[tab],a=D[tab].filter(r=>JSON.stringify(r).toLowerCase().includes(q.toLowerCase()));
 $('#items').innerHTML=a.length?a.map(r=>'<div class="card" data-id="'+r.id+'"><b>'+esc(r[s.k]||'Untitled')+'</b><small>'+esc((s.m&&r[s.m])||r.cls||'')+'</small></div>').join(''):'<p class="empty">Nothing saved yet. Tap New to add a '+s.n+'.</p>';
 document.querySelectorAll('.card').forEach(c=>c.onclick=()=>{cur=c.dataset.id;render()});
}
function list(){
 $('#app').innerHTML='<div class="bar"><input id="q" placeholder="Search '+S[tab].t.toLowerCase()+'" value="'+esc(q)+'"><button class="pri" id="new">New</button></div><div id="items"></div>';
 $('#q').oninput=e=>{q=e.target.value;items()};
 $('#new').onclick=()=>{cur='new';render()};
 items();
}
function form(){
 const s=S[tab],isNew=cur==='new',p=D.pre||{};
 const r=isNew?Object.assign({school:p.school,teacher:p.teacher,cls:p.cls},seed||{}):(D[tab].find(x=>x.id===cur)||{});seed=null;
 $('#app').innerHTML='<button class="link" id="back">Back to '+s.t.toLowerCase()+'</button><h2>'+(isNew?'New ':'Edit ')+s.n+'</h2>'+
 s.f.map(([k,l,t])=>t==='h'?'<h3>'+l+'</h3>':t==='area'?'<label>'+l+'<textarea data-k="'+k+'" rows="4">'+esc(r[k])+'</textarea></label>':'<label>'+l+'<input data-k="'+k+'" type="'+(t||'text')+'" value="'+esc(r[k])+'"></label>').join('')+
 '<div class="row"><button class="pri" id="sv">Save</button>'+(tab==='plans'?'<button id="dn">Draft with Daniel</button>':'')+'<button id="sh">Share</button>'+(tab==='plans'?'<button id="dw">Download Word</button><button id="pd">Save as PDF</button>':'')+'<button id="pr">Print</button>'+(isNew?'':'<button class="del" id="dl">Delete</button>')+'</div>';
 const get=()=>{const o={};document.querySelectorAll('[data-k]').forEach(e=>o[e.dataset.k]=e.value.trim());return o};
 $('#back').onclick=()=>{cur=null;render()};
 $('#sv').onclick=()=>{
  const o=get();
  if(isNew){o.id=String(Date.now());D[tab].unshift(o)}else{const i=D[tab].findIndex(x=>x.id===cur);o.id=cur;D[tab][i]=o}
  if(o.school||o.teacher||o.cls)D.pre={school:o.school,teacher:o.teacher,cls:o.cls};
  save();cur=null;render();
 };
 $('#sh').onclick=async()=>{
  const o=get(),txt=s.f.map(([k,l,t])=>t==='h'?'== '+l+' ==':(o[k]?l+':\n'+o[k]:'')).filter(Boolean).join('\n\n');
  try{if(navigator.share){await navigator.share({title:o[s.k]||s.n,text:txt})}else{await navigator.clipboard.writeText(txt);alert('Copied. Paste it into WhatsApp or a document.')}}catch(e){}
 };
 $('#pr').onclick=()=>window.print();
 if(tab==='plans'){$('#dw').onclick=()=>exportPlan(get(),'doc');$('#pd').onclick=()=>exportPlan(get(),'pdf')}
 if(tab==='plans')$('#dn').onclick=()=>{const o=get();if(!o.topic){alert('Type the topic first, then tap Draft with Daniel.');return}const d=draft(o);let n=0;Object.keys(d).forEach(k=>{const e=document.querySelector('[data-k="'+k+'"]');if(e&&!e.value.trim()){e.value=d[k];n++}});alert(n?'Daniel filled '+n+' empty sections. Read them and change anything that does not fit your class.':'All sections already have text, so Daniel left them as they are.')};
 if(!isNew)$('#dl').onclick=()=>{if(confirm('Delete this '+s.n+'? This cannot be undone.')){D[tab]=D[tab].filter(x=>x.id!==cur);save();cur=null;render()}};
 scrollTo(0,0);
}

const idb=()=>new Promise((ok,no)=>{const r=indexedDB.open('zmp-files',1);r.onupgradeneeded=()=>r.result.createObjectStore('f');r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});
const fdo=async(m,fn)=>{const db=await idb();return new Promise((ok,no)=>{const t=db.transaction('f',m),rq=fn(t.objectStore('f'));t.oncomplete=()=>ok(rq.result);t.onerror=()=>no(t.error);t.onabort=()=>no(t.error)})};
let lf={g:'',t:''};
const mb=n=>(n/1048576).toFixed(1)+' MB';
function litems(){
 const a=D.lib.filter(r=>(!lf.g||r.grade===lf.g)&&(!lf.t||r.type===lf.t)&&JSON.stringify(r).toLowerCase().includes(q.toLowerCase()));
 $('#items').innerHTML=a.length?a.map(r=>'<div class="card" data-id="'+r.id+'"><b>'+esc(r.title)+'</b><small>'+esc([r.grade,r.subject,r.year,r.type].filter(Boolean).join(', '))+'</small></div>').join(''):'<p class="empty">No files yet. Tap Add to save a PDF on this phone.</p>';
 document.querySelectorAll('.card').forEach(c=>c.onclick=()=>{cur=c.dataset.id;render()});
}
function lib(){
 $('#app').innerHTML='<div class="bar"><input id="q" placeholder="Search papers and books" value="'+esc(q)+'"><button class="pri" id="new">Add</button></div><div class="bar"><select id="fg"><option value="">All grades</option><option>Grade 10</option><option>Grade 12</option><option>Other</option></select><select id="ft"><option value="">Papers and books</option><option>Past paper</option><option>Book</option></select></div><div id="items"></div><p class="empty">'+(PARTNER?'Library in partnership with '+esc(PARTNER)+'. ':'')+(DESIGNER?'Designed by '+esc(DESIGNER)+'. ':'')+'Add PDFs you already have, for example from your school, the Examinations Council of Zambia or the Ministry of Education. They are saved on this phone and open without internet.</p>';
 $('#fg').value=lf.g;$('#ft').value=lf.t;
 $('#q').oninput=e=>{q=e.target.value;litems()};
 $('#fg').onchange=e=>{lf.g=e.target.value;litems()};
 $('#ft').onchange=e=>{lf.t=e.target.value;litems()};
 $('#new').onclick=()=>{cur='new';render()};
 litems();
}
function libForm(){
 const isNew=cur==='new',r=isNew?{}:(D.lib.find(x=>x.id===cur)||{});
 if(!isNew&&!r.id){cur=null;return lib()}
 if(isNew){
  $('#app').innerHTML='<button class="link" id="back">Back to library</button><h2>Add a PDF</h2>'+
  '<label>PDF file<input id="file" type="file" accept="application/pdf,.pdf"></label>'+
  '<label>Title<input id="title" placeholder="For example, Mathematics Paper 1"></label>'+
  '<label>Type<select id="type"><option>Past paper</option><option>Book</option></select></label>'+
  '<label>Grade<select id="grade"><option>Grade 10</option><option>Grade 12</option><option>Other</option></select></label>'+
  '<label>Subject<input id="subject"></label><label>Year<input id="year" type="number" placeholder="For example, 2023"></label>'+
  '<div class="row"><button class="pri" id="sv">Save to phone</button></div>';
  $('#file').onchange=e=>{const f=e.target.files[0];if(f&&!$('#title').value)$('#title').value=f.name.replace(/\.pdf$/i,'')};
  $('#sv').onclick=async()=>{
   const f=$('#file').files[0];
   if(!f){alert('Choose a PDF file first.');return}
   const id=String(Date.now());
   try{await fdo('readwrite',s=>s.put(f,id))}catch(e){alert('Could not save this file. Free some storage on your phone and try again.');return}
   D.lib.unshift({id,title:$('#title').value.trim()||f.name,type:$('#type').value,grade:$('#grade').value,subject:$('#subject').value.trim(),year:$('#year').value.trim(),size:f.size});
   save();try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
   cur=null;render();
  };
 }else{
  $('#app').innerHTML='<button class="link" id="back">Back to library</button><h2>'+esc(r.title)+'</h2><p>'+esc([r.grade,r.subject,r.year,r.type].filter(Boolean).join(', '))+'<br>'+mb(r.size||0)+'</p><div class="row"><button class="pri" id="open">Open PDF</button><button class="del" id="dl">Delete</button></div>';
  $('#open').onclick=async()=>{
   try{const f=await fdo('readonly',s=>s.get(r.id));if(!f){alert('This file is missing. Add it again.');return}
   const u=URL.createObjectURL(f);window.open(u,'_blank')||(location.href=u)}catch(e){alert('Could not open this file.')}
  };
  $('#dl').onclick=async()=>{if(confirm('Delete this file from your phone?')){try{await fdo('readwrite',s=>s.delete(r.id))}catch(e){}D.lib=D.lib.filter(x=>x.id!==r.id);save();cur=null;render()}};
 }
 $('#back').onclick=()=>{cur=null;render()};
 scrollTo(0,0);
}

const PARTNER='Mukuba University',DESIGNER='Steve Chilwa';
$('#dsg').textContent=DESIGNER?'Designed by '+DESIGNER:'';
$('#pn').textContent=PARTNER?'In partnership with '+PARTNER:'';
let seed=null;
const SEN={Mathematics:'Algebra|Functions and graphs|Geometry|Trigonometry|Statistics|Probability|Sets|Matrices|Vectors',Biology:'Cell biology|Nutrition|Transport in living things|Respiration|Reproduction|Genetics and evolution|Ecology|Human health and disease',Chemistry:'Matter and its particles|Atomic structure|Chemical bonding|Acids, bases and salts|Reactions and rates|Electrochemistry|Organic chemistry|Metals and non-metals',Physics:'Mechanics and motion|Energy and work|Heat|Waves, light and sound|Electricity|Magnetism|Atomic and nuclear physics',English:'Comprehension|Summary writing|Essay and letter writing|Grammar and usage|Literature'};
const TOP={'Grade 6':{Mathematics:'Whole numbers|Fractions|Decimals|Percentages|Ratio and proportion|Length, mass and capacity|Time and money|Angles and shapes|Perimeter and area|Simple equations|Graphs and averages',English:'Listening and speaking|Reading comprehension|Composition writing|Grammar: tenses|Grammar: parts of speech|Vocabulary and spelling|Letter writing','Integrated Science':'Living things|Plants|Human body systems|Health and diseases|Matter and materials|Energy|Forces and machines|Electricity|Earth and space|Environment and conservation','Social Studies':'Zambia history and independence|Government and citizenship|Zambia economy|Map work|Africa and the world|Family and community','Creative and Technology Studies':'Design and making|Drawing and painting|Food and nutrition|Agriculture|Music and drama|Basic technology'},'Grade 10':SEN,'Grade 12':SEN};
let dv={g:'Grade 6',s:'',t:''};
const topics=(g,s)=>((TOP[g]||{})[s]||'').split('|').filter(Boolean).concat(D.ct.filter(x=>x.g===g&&x.s===s).map(x=>x.t));
const opts=(a,sel,ph)=>(ph?'<option value="">'+ph+'</option>':'')+a.map(x=>'<option'+(x===sel?' selected':'')+'>'+esc(x)+'</option>').join('');
function draft(o){
 const t=o.topic||'the topic',sub=(o.subject||'').toLowerCase(),tot=parseInt(o.dur)||40;
 const sci=/science|biology|chemistry|physics/.test(sub),math=/math/.test(sub),eng=/english/.test(sub);
 const oc=o.goal||('understand and use ideas about '+t);
 const sh=[.15,.30,.25,.15,.15].map(p=>Math.max(1,Math.round(tot*p)));
 const act=math?'solve practice problems step by step':sci?'observe, test and record findings':eng?'read, speak and write using examples':'discuss, investigate and record answers';
 const d={
  goal:'To help learners '+oc+'.',
  competences:'Communication, collaboration, observation, problem solving and analysing, critical thinking',
  target:'Learners use what they learn about '+t+' correctly in everyday life.',
  c1:'Knowledge based: identifying and naming the key ideas in '+t,
  c2:'Cognitive based: explaining, comparing or classifying ideas in '+t,
  c3:'Skill based: applying '+t+' to solve a real problem',
  method:'Group work, guided discovery, discussion and demonstration',
  af:'Observation, monitoring participation and engagement, and how well learners work in groups',
  as:'Open-ended questions and a short written task on '+t,
  mat:'Chalkboard and chalk, learners\' textbook, charts or real objects about '+t,
  env:'Natural: school surroundings, home. Artificial: classroom. Technological: videos or charts if available.',
  prior:'Learners have met basic ideas related to '+t+' in earlier lessons.',
  cont:'Learners use '+t+' at home or in the community and report back in the next lesson.'
 };
 const T={
  eng:['Greet learners. Ask a question that links '+t+' to daily life and review what they already know.','Answer questions and share ideas and experiences.','Communication, critical thinking','Monitor participation and engagement.'],
  exp:['- Introduce the activity\n- Divide learners into small groups\n- Give clear instructions and materials\n- Move around, guide and ask probing questions','- In groups, '+act+' on '+t+'\n- Record findings\n- Prepare to present','Collaboration, communication, observation, psychomotor, problem solving','Check that learners work correctly and safely; ask open-ended questions.'],
  xpl:['- Ask groups to present their findings\n- Explain the key ideas of '+t+' and link them to what learners found\n- Correct misconceptions','Present findings, give feedback, listen and take notes.','Presentation, critical thinking, note taking','Monitor presentations; ask open-ended questions; check that learners take notes.'],
  syn:['Give concise notes on '+t+': key terms and key points. Show how the ideas apply in other situations and subjects.','Write notes, make corrections and give examples from daily life.','Critical thinking, creativity, problem solving','Check notes; check that learners apply the ideas correctly.'],
  evl:['1. What was easy or difficult about '+t+'?\n2. How did your group reach agreement?\n- Give feedback on responses','Reflect, answer the questions and give feedback.','Communication, critical thinking, reflection','Monitor the discussion; ask open-ended questions.']
 };
 ['eng','exp','xpl','syn','evl'].forEach((k,i)=>{d[k+'D']=String(sh[i]);d[k+'T']=T[k][0];d[k+'L']=T[k][1];d[k+'C']=T[k][2];d[k+'A']=T[k][3]});
 return d;
}
function daniel(){
 const subs=Object.keys(TOP[dv.g]),tp=topics(dv.g,dv.s);
 if(!subs.includes(dv.s)){dv.s=subs[0];return daniel()}
 $('#app').innerHTML='<h2>Daniel</h2><p>Daniel is your planning helper. Pick a topic and he drafts a full lesson plan in the CBC format for you to edit, and finds matching papers in your Library. He works offline.</p>'+
 '<label>Grade<select id="dg">'+opts(Object.keys(TOP),dv.g)+'</select></label><label>Subject<select id="dsb">'+opts(subs,dv.s)+'</select></label><label>Topic<select id="dt">'+opts(tp,dv.t,'Choose a topic')+'</select></label><label>Or type your own topic<input id="dx"></label>'+
 '<div class="row"><button class="pri" id="bd">Draft a lesson plan</button><button id="bp">Find papers and books</button><button id="bs">Save my topic</button></div><div id="res"></div><p class="empty">These topic lists are starting points. Check them against your syllabus and use Save my topic to add your own.</p>';
 const topic=()=>$('#dx').value.trim()||$('#dt').value;
 $('#dg').onchange=e=>{dv.g=e.target.value;dv.s='';dv.t='';daniel()};
 $('#dsb').onchange=e=>{dv.s=e.target.value;dv.t='';daniel()};
 $('#dt').onchange=e=>{dv.t=e.target.value};
 $('#bd').onclick=()=>{const t=topic();if(!t){alert('Choose or type a topic first.');return}seed=Object.assign({cls:dv.g,subject:dv.s,topic:t},draft({topic:t,subject:dv.s}));tab='plans';cur='new';render()};
 $('#bs').onclick=()=>{const t=$('#dx').value.trim();if(!t){alert('Type your topic in the box first.');return}D.ct.push({g:dv.g,s:dv.s,t});save();dv.t=t;daniel()};
 $('#bp').onclick=()=>{
  const t=topic().toLowerCase(),words=t.split(/\W+/).filter(w=>w.length>3),sb=dv.s.toLowerCase();
  const hit=D.lib.filter(r=>{const h=(r.title+' '+r.subject).toLowerCase();return (sb&&h.includes(sb))||words.some(w=>h.includes(w))});
  $('#res').innerHTML=hit.length?'<h3>Matching files in your Library</h3>'+hit.map(r=>'<div class="card" data-id="'+r.id+'"><b>'+esc(r.title)+'</b><small>'+esc([r.grade,r.subject,r.year,r.type].filter(Boolean).join(', '))+'</small></div>').join(''):'<p class="empty">No matching files yet. Add PDFs in the Library tab and Daniel will find them by title and subject. He cannot read inside the PDFs yet.</p>';
  document.querySelectorAll('#res .card').forEach(c=>c.onclick=()=>{tab='lib';cur=c.dataset.id;render()});
 };
 scrollTo(0,0);
}

function planHTML(o){
 const e=x=>esc(x||'').replace(/\n/g,'<br>');
 const r1=(l,v)=>'<tr><td colspan="5"><b>'+l+':</b> '+e(v)+'</td></tr>';
 let h='<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word"><head><meta charset="utf-8"><title>Lesson plan</title><style>@page WordSection1{size:841.9pt 595.3pt;mso-page-orientation:landscape;margin:36pt}div.WordSection1{page:WordSection1}@page{size:A4 landscape;margin:1.5cm}body{font-family:Calibri,Arial,sans-serif;font-size:11pt}table{border-collapse:collapse;width:100%;margin-bottom:12pt}td,th{border:1px solid #444;padding:5px;vertical-align:top;text-align:left}th{background:#d9ead3}h3{margin:6pt 0}</style></head><body><div class="WordSection1">';
 h+='<h3>Lesson plan'+(o.school?' - '+e(o.school):'')+'</h3>'+(o.teacher?'<p>Teacher: '+e(o.teacher)+'</p>':'');
 h+='<table><tr><th colspan="5">Preliminary Information</th></tr>';
 [['Subject','subject'],['Level','cls'],['Concept','concept'],['Sub-concepts','subc'],['Topic','topic'],['Subtopic','subtopic']].forEach(a=>h+=r1(a[0],o[a[1]]));
 h+=r1('Lesson Duration',o.dur?o.dur+' minutes':'')+r1('Time',o.time)+r1('Date',o.date)+r1('Lesson Goal',o.goal)+r1('Competences',o.competences)+r1('Expected Target Competence',o.target);
 h+=r1('Lesson Competencies',[o.c1,o.c2,o.c3].filter(Boolean).join('\n'))+r1('Lesson Methodology and strategies',o.method);
 h+=r1('Assessment Strategies','Formative: '+(o.af||'')+'\nSummative: '+(o.as||''))+r1('Learning Materials',o.mat)+r1('Learning Environment',o.env)+r1('Prior Knowledge',o.prior)+r1('Interdisciplinary Connections',o.inter)+'</table>';
 h+='<table><tr><th colspan="5">Lesson Progression</th></tr><tr><th></th><th>Teacher Activity (acts as facilitator)</th><th>Learner Activity (creates knowledge actively, not passively)</th><th>Targeted Competency</th><th>Assessment Criteria</th></tr>';
 ST.forEach(([k,l])=>h+='<tr><td><b>'+e(l)+'</b><br>[Duration: '+e(o[k+'D'])+' min]</td><td>'+e(o[k+'T'])+'</td><td>'+e(o[k+'L'])+'</td><td>'+e(o[k+'C'])+'</td><td>'+e(o[k+'A'])+'</td></tr>');
 h+=r1('Competence Continuity and Strategy',o.cont)+'</table>';
 h+='<p style="font-size:9pt;color:#555">Prepared with ZM Planner.'+(DESIGNER?' Designed by '+e(DESIGNER)+'.':'')+(PARTNER?' In partnership with '+e(PARTNER)+'.':'')+'</p></div></body></html>';
 return h;
}
function exportPlan(o,mode){

 if(mode==='pdf'){
  const w=window.open('','_blank');

  return;
 }

}
