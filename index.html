
<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ZM Planner</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<meta name="theme-color" content="#14532d">
<style>
:root{--bg:#eef2ee;--card:#fff;--tx:#18201a;--mut:#5d6b60;--pri:#14532d;--on:#fff;--acc:#b45309;--bd:#d3dcd4;--red:#b42318}
@media(prefers-color-scheme:dark){:root{--bg:#0f1511;--card:#18201a;--tx:#e8efe9;--mut:#9aa89d;--pri:#4ade80;--on:#06210f;--acc:#f0a45a;--bd:#2a362c;--red:#f87171}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 Georgia,'Times New Roman',serif;padding-bottom:84px}
header{background:var(--pri);color:var(--on);padding:14px 16px;font:700 20px system-ui,sans-serif;border-bottom:4px solid var(--acc)}
header small{display:block;font:400 13px system-ui,sans-serif;opacity:.85}
main{max-width:640px;margin:0 auto;padding:14px}
button,input,textarea{font:inherit}
button{border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:10px 14px;border-radius:8px;font-family:system-ui,sans-serif}
button.pri{background:var(--pri);color:var(--on);border-color:var(--pri);font-weight:600}
button.del{color:var(--red)}
button.link{border:0;background:none;color:var(--pri);padding:6px 0;font-weight:600}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--acc);outline-offset:1px}
.bar{display:flex;gap:8px;margin-bottom:12px}
.bar input{flex:1}
input,textarea,select{width:100%;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx)}
label{display:block;margin:12px 0;font:600 14px system-ui,sans-serif;color:var(--mut)}
label input,label textarea,label select{margin-top:4px;font:16px Georgia,serif;color:var(--tx)}
.card{background:var(--card);border:1px solid var(--bd);border-left:5px solid var(--acc);border-radius:8px;padding:12px 14px;margin-bottom:10px}
.card b{display:block}.card small{color:var(--mut);font-family:system-ui,sans-serif}
.empty{color:var(--mut);text-align:center;padding:30px 10px}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;border-radius:0;background:none;padding:14px 1px;color:var(--mut);font-weight:600;font-size:12px}
nav button.on{color:var(--pri);box-shadow:inset 0 3px 0 var(--acc)}
h3{margin:24px 0 4px;color:var(--pri);font:700 17px system-ui,sans-serif;border-bottom:2px solid var(--acc);padding-bottom:4px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid button{padding:22px 8px;font-weight:600}.bar2{height:10px;background:var(--bd);border-radius:6px;overflow:hidden;margin:6px 0 12px}.bar2 i{display:block;height:100%;background:var(--pri)}
#toast{position:fixed;left:12px;right:12px;bottom:62px;background:var(--pri);color:var(--on);padding:12px 14px;border-radius:8px;z-index:50;display:none;font:15px/1.4 system-ui,sans-serif}
#dlg{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:60;padding:20px}
#dlg>div{background:var(--card);color:var(--tx);padding:18px;border-radius:12px;max-width:420px;width:100%}
.banner{background:#fff3cd;color:#5c4400;padding:10px 14px;font:14px/1.4 system-ui,sans-serif}
.reg{border:1px solid var(--bd);border-radius:8px;overflow:hidden;background:var(--card)}
.reg>div{display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid var(--bd);min-height:44px}
.reg>div:last-child{border-bottom:0}
.reg>div:nth-child(even){background:rgba(127,127,127,.08)}
.reg .rn{flex:0 0 26px;color:var(--mut);font:600 13px system-ui,sans-serif;text-align:right}
.reg .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.reg select{width:auto;padding:6px}
.reg input[type=number]{width:90px;text-align:right}
.reg button{padding:6px 10px}
textarea.lined{min-height:150px;line-height:26px;padding:2px 10px;background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 25px,var(--bd) 25px,var(--bd) 26px);background-attachment:local}
#pa{display:none}
@page{size:A4 landscape;margin:1.5cm}
@media print{header,nav,main,.banner,#toast,#dlg{display:none!important}#pa{display:block}body{background:#fff;color:#000;padding:0}#pa table{border-collapse:collapse;width:100%;margin-bottom:12px;font:12px/1.35 Arial,sans-serif}#pa td,#pa th{border:1px solid #444;padding:5px;vertical-align:top;text-align:left;color:#000}#pa th{background:#d9ead3}}
</style></head><body>
<header>ZM Planner<small>Offline lesson planning for Zambian teachers</small><small id="dsg"></small><small id="pn"></small></header>
<main id="app"></main>
<nav>
<button data-t="plans">Plans</button>
<button data-t="scheme">Schemes</button>
<button data-t="class">Class</button>
<button data-t="lib">Library</button>
<button data-t="daniel">Daniel</button>
<button data-t="more">More</button>
</nav>
<div id="pa"></div>
<script>
const ST=[['eng','Engagement (Introduction)'],['exp','Exploration (Development)'],['xpl','Explanation (Conceptualization)'],['syn','Synthesis (Continuity and Extension)'],['evl','Evaluation and reflection (Conclusion)']];
const planF=[['h0','Preliminary information','h'],['school','School'],['teacher','Teacher'],['subject','Subject'],['cls','Level or class'],['concept','Concept'],['subc','Sub-concepts'],['topic','Topic'],['subtopic','Subtopic'],['dur','Lesson duration in minutes','number'],['time','Time (for example, 10:10 to 11:50)'],['date','Date','date'],['goal','Lesson goal','area'],['competences','Competences','area'],['target','Expected target competence','area'],['c1','Lesson competency 1 (knowledge based)','area'],['c2','Lesson competency 2 (cognitive based)','area'],['c3','Lesson competency 3 (skill based)','area'],['method','Lesson methodology and strategies','area'],['af','Formative assessment strategies','area'],['as','Summative assessment strategies','area'],['mat','Learning materials','area'],['env','Learning environment (natural, artificial, technological)','area'],['prior','Prior knowledge','area'],['inter','Interdisciplinary connections','area'],['h1','Lesson progression','h']];
ST.forEach(([k,l])=>planF.push(['h'+k,l,'h'],[k+'D','Duration in minutes','number'],[k+'T','Teacher activity (facilitator)','area'],[k+'L','Learner activity','area'],[k+'C','Targeted competency','area'],[k+'A','Assessment criteria','area']));
planF.push(['cont','Competence continuity and strategy','area']);
const S={
plans:{t:'Lesson plans',n:'lesson plan',k:'topic',m:'subject',f:planF},
scheme:{t:'Schemes of work',n:'scheme of work',k:'topic',m:'week',f:[['school','School'],['teacher','Teacher'],['cls','Class'],['subject','Subject'],['term','Term'],['week','Week (for example, Week 1)'],['topic','Topic'],['outcome','Specific outcomes','area'],['act','Activities','area'],['mat','Materials','area'],['assess','Assessment','area'],['rem','Remarks','area']]},
notes:{t:'Notes',n:'note',k:'title',m:'',f:[['title','Title'],['body','Note','area']]}
};
let D={plans:[],scheme:[],notes:[],lib:[],ct:[],classes:[],marks:[],att:{},cov:{},pre:{}},tab='plans',cur=null,q='';
try{D=Object.assign(D,JSON.parse(localStorage.getItem('zmp')||'{}'))}catch(e){}
if(!D.pre) D.pre = {};
const save=()=>{try{localStorage.setItem('zmp',JSON.stringify(D))}catch(e){toast('Could not save on this phone. Free some storage and try again.')}};
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function render(){
 document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
 if(tab==='more')return more();
 if(tab==='class')return clsView();
 if(tab==='daniel')return daniel();
 if(tab==='lib')return cur===null?lib():libForm();
 cur===null?list():form();
}
function items(){
 const s=S[tab],a=D[tab].filter(r=>JSON.stringify(r).toLowerCase().indexOf(q.toLowerCase())>-1);
 $('#items').innerHTML=a.length?a.map(r=>'<div class="card" data-id="'+r.id+'"><b>'+esc(r[s.k]||'Untitled')+'</b><small>'+esc((s.m&&r[s.m])||r.cls||'')+'</small></div>').join(''):'<p class="empty">Nothing saved yet. Tap New to add a '+s.n+'.</p>';
 document.querySelectorAll('.card').forEach(c=>c.onclick=()=>{cur=c.dataset.id;render()});
}
function list(){
 $('#app').innerHTML='<div class="bar"><input id="q" placeholder="Search '+S[tab].t.toLowerCase()+'" value="'+esc(q)+'"><button class="pri" id="new">New</button></div><div id="items"></div>';
 $('#q').oninput=e=>{q=e.target.value;items()};
 $('#new').onclick=()=>{cur='new';render()};
 items();
}
function form(){
 const s=S[tab],isNew=cur==='new',p=D.pre||{};
 const r=isNew?Object.assign({school:p.school,teacher:p.teacher,cls:p.cls},seed||{}):(D[tab].find(x=>x.id===cur)||{});seed=null;
 $('#app').innerHTML='<button class="link" id="back">Back to '+s.t.toLowerCase()+'</button><h2>'+(isNew?'New ':'Edit ')+s.n+'</h2>'+
 s.f.map(([k,l,t])=>t==='h'?'<h3>'+l+'</h3>':t==='area'?'<label>'+l+'<textarea data-k="'+k+'" rows="4">'+esc(r[k])+'</textarea></label>':'<label>'+l+'<input data-k="'+k+'" type="'+(t||'text')+'" value="'+esc(r[k])+'"></label>').join('')+
 '<div class="row"><button class="pri" id="sv">Save</button>'+(tab==='plans'?'<button id="dn">Draft with Daniel</button>':'')+'<button id="sh">Share</button>'+(tab==='plans'?'<button id="dw">Download Word</button><button id="pd">Save as PDF</button>':'')+'<button id="pr">Print</button>'+(isNew?'':'<button class="del" id="dl">Delete</button>')+'</div>';
 const get=()=>{const o={};document.querySelectorAll('[data-k]').forEach(e=>o[e.dataset.k]=e.value.trim());return o};
 $('#back').onclick=()=>{cur=null;render()};
 $('#sv').onclick=()=>{
  const o=get();
  if(isNew){o.id=String(Date.now());D[tab].unshift(o)}else{const i=D[tab].findIndex(x=>x.id===cur);o.id=cur;D[tab][i]=o}
  if(o.school||o.teacher||o.cls)D.pre={school:o.school,teacher:o.teacher,cls:o.cls};
  save();cur=null;render();
 };
 $('#sh').onclick=async()=>{
  const o=get(),txt=s.f.map(([k,l,t])=>t==='h'?'== '+l+' ==':(o[k]?l+':\n'+o[k]:'')).filter(Boolean).join('\n\n');
  await shareText(o[s.k]||s.n, txt);
 };
 $('#pr').onclick=()=>printArea(tab==='plans'?planBody(get()):genBody(get(),s));
 if(tab==='plans'){$('#dw').onclick=()=>exportPlan(get(),'doc');$('#pd').onclick=()=>exportPlan(get(),'pdf')}
 
 if(tab==='plans')$('#dn').onclick=()=>{
  const o=get();
  if(!o.topic){toast('Type the topic first, then tap Draft with Daniel.');return}
  
  let hasContent=false;
  document.querySelectorAll('[data-k]').forEach(e=>{if(e.value.trim())hasContent=true});
  
  const doFill=()=>{
      let d;
      try{ d=draft(o) }catch(e){ toast('Daniel could not draft this plan: '+(e&&e.message||e),8000); return }
      let n=0,first=null;
      Object.keys(d).forEach(k=>{
          const e=document.querySelector('[data-k="'+k+'"]');
          if(e){
              e.value=d[k];
              n++;
              if(!first)first=e;
          }
      });
      if(n){
          toast('Daniel filled '+n+' sections with a complete draft.');
          try{first.scrollIntoView({behavior:'smooth',block:'center'})}catch(e){}
      }
  };

  if(hasContent){
      ask('Daniel will fill the plan. This will overwrite any text you already typed. Continue?', doFill);
  }else{
      doFill();
  }
 };
 if(!isNew)$('#dl').onclick=()=>ask('Delete this '+s.n+'? This cannot be undone.',()=>{D[tab]=D[tab].filter(x=>x.id!==cur);save();cur=null;render();toast('Deleted.')});
 scrollTo(0,0);
}

/* ---------- small cross-browser helpers ---------- */
function downloadBlob(blob,filename){
 const a=document.createElement('a');
 let u;
 try{u=URL.createObjectURL(blob)}catch(e){toast('Could not prepare the file: '+(e&&e.message||e),8000);return false}
 if('download' in a){
  a.href=u;a.download=filename;a.rel='noopener';a.style.position='fixed';a.style.top='-1000px';a.style.left='-1000px';
  document.body.appendChild(a);
  try{a.click()}catch(e){a.remove();URL.revokeObjectURL(u);toast('Could not start the download. Open the app in Chrome.',8000);return false}
  setTimeout(()=>{a.remove();URL.revokeObjectURL(u)},10000);
  return true;
 }
 try{window.open(u,'_blank');setTimeout(()=>URL.revokeObjectURL(u),10000);return true}catch(e){URL.revokeObjectURL(u);toast('Downloads are not supported here. Open the app in Chrome.',8000);return false}
}
async function copyText(txt){
 try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(txt);return true}}catch(e){}
 try{
  const ta=document.createElement('textarea');
  ta.value=txt;ta.setAttribute('readonly','');ta.style.position='fixed';ta.style.top='-1000px';ta.style.opacity='0';
  document.body.appendChild(ta);ta.select();ta.setSelectionRange(0,ta.value.length);
  const ok=document.execCommand('copy');ta.remove();return ok;
 }catch(e){return false}
}
async function shareText(title,txt){
 try{if(navigator.share){await navigator.share({title:title,text:txt});return}}catch(e){if(e&&e.name==='AbortError')return}
 if(await copyText(txt)){toast('Copied. Paste it into WhatsApp or a document.');return}
 showText(txt);
}

const idb=()=>new Promise((ok,no)=>{
 try{
  const r=indexedDB.open('zmp-files',1);
  r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains('f'))r.result.createObjectStore('f')};
  r.onsuccess=()=>ok(r.result);
  r.onerror=()=>no(r.error||new Error('IndexedDB error'));
 }catch(e){no(e)}
});
const fdo=async(m,fn)=>{
 const db=await idb();
 return new Promise((ok,no)=>{
  let t;
  try{t=db.transaction('f',m)}catch(e){return no(e)}
  let rq;
  try{rq=fn(t.objectStore('f'))}catch(e){return no(e)}
  t.oncomplete=()=>ok(rq?rq.result:undefined);
  t.onerror=()=>no(t.error||new Error('IndexedDB transaction error'));
  t.onabort=()=>no(t.error||new Error('IndexedDB transaction aborted'));
 });
};
let lf={g:'',t:''};
const mb=n=>(n/1048576).toFixed(1)+' MB';
function litems(){
 const a=D.lib.filter(r=>(!lf.g||r.grade===lf.g)&&(!lf.t||r.type===lf.t)&&JSON.stringify(r).toLowerCase().indexOf(q.toLowerCase())>-1);
 $('#items').innerHTML=a.length?a.map(r=>'<div class="card" data-id="'+r.id+'"><b>'+esc(r.title)+'</b><small>'+esc([r.grade,r.subject,r.year,r.type].filter(Boolean).join(', '))+'</small></div>').join(''):'<p class="empty">No files yet. Tap Add to save a PDF on this phone.</p>';
 document.querySelectorAll('.card').forEach(c=>c.onclick=()=>{cur=c.dataset.id;render()});
}
function lib(){
 $('#app').innerHTML='<div class="bar"><input id="q" placeholder="Search papers and books" value="'+esc(q)+'"><button class="pri" id="new">Add</button></div><div class="bar"><select id="fg"><option value="">All grades</option><option>Form 4 (Grade 10)</option><option>Form 6 (Grade 12)</option><option>Other</option></select><select id="ft"><option value="">Papers and books</option><option>Past paper</option><option>Book</option></select></div><div id="items"></div><p class="empty">'+(PARTNER?'Library in partnership with '+esc(PARTNER)+'. ':'')+(DESIGNER?'Designed by '+esc(DESIGNER)+'. ':'')+'Add PDFs you already have, for example from your school, the Examinations Council of Zambia or the Ministry of Education. They are saved on this phone and open without internet.</p>';
 $('#fg').value=lf.g;$('#ft').value=lf.t;
 $('#q').oninput=e=>{q=e.target.value;litems()};
 $('#fg').onchange=e=>{lf.g=e.target.value;litems()};
 $('#ft').onchange=e=>{lf.t=e.target.value;litems()};
 $('#new').onclick=()=>{cur='new';render()};
 litems();
}
function libForm(){
 const isNew=cur==='new',r=isNew?{}:(D.lib.find(x=>x.id===cur)||{});
 if(!isNew&&!r.id){cur=null;return lib()}
 if(isNew){
  $('#app').innerHTML='<button class="link" id="back">Back to library</button><h2>Add a file</h2><p>Choose a PDF, a photo of a paper, or a Word file from your phone.</p>'+
  '<label>File<input id="file" type="file"></label><p id="fn" class="empty" style="text-align:left;padding:0"></p>'+
  '<label>Title<input id="title" placeholder="For example, Mathematics Paper 1"></label>'+
  '<label>Type<select id="type"><option>Past paper</option><option>Book</option><option>Other</option></select></label>'+
  '<label>Grade<select id="grade"><option>Form 4 (Grade 10)</option><option>Form 6 (Grade 12)</option><option>Other</option></select></label>'+
  '<label>Subject<input id="subject"></label><label>Year<input id="year" type="number" placeholder="For example, 2023"></label>'+
  '<div class="row"><button class="pri" id="sv">Save to phone</button></div>';
  $('#file').onchange=e=>{const f=e.target.files[0];if(!f)return;$('#fn').textContent='Selected: '+f.name+' ('+mb(f.size)+')';if(!$('#title').value)$('#title').value=f.name.replace(/\.[A-Za-z0-9]{2,5}$/,'')};
  $('#sv').onclick=async()=>{
   const f=$('#file').files[0];
   if(!f){toast('Tap the File box and choose a file first.');return}
   if(!('indexedDB' in window)){toast('This browser cannot store files offline. Open the app in Chrome.',9000);return}
   const id=String(Date.now());
   try{await fdo('readwrite',s=>s.put(f,id))}catch(e){toast('Could not save this file: '+(e&&e.message||e)+'. Try a smaller file, or open the app in Chrome.',9000);return}
   D.lib.unshift({id,title:$('#title').value.trim()||f.name,name:f.name,type:$('#type').value,grade:$('#grade').value,subject:$('#subject').value.trim(),year:$('#year').value.trim(),size:f.size});
   save();try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
   toast('Saved to this phone.');cur=null;render();
  };
 }else{
  $('#app').innerHTML='<button class="link" id="back">Back to library</button><h2>'+esc(r.title)+'</h2><p>'+esc([r.grade,r.subject,r.year,r.type].filter(Boolean).join(', '))+'<br>'+mb(r.size||0)+'</p><div class="row"><button class="pri" id="open">Open</button><button id="dlf">Download copy</button><button class="del" id="dl">Delete</button></div>';
  const getF=async()=>{try{const f=await fdo('readonly',s=>s.get(r.id));if(!f)toast('This file is missing. Add it again.');return f}catch(e){toast('Could not read this file: '+(e&&e.message||e),8000);return null}};
  const go=async(save)=>{const f=await getF();if(!f)return;const u=URL.createObjectURL(f),a=document.createElement('a');a.href=u;if(save){const n=r.name||r.title;a.download=/\.[A-Za-z0-9]{2,5}$/.test(n)?n:n+'.pdf'}else{a.target='_blank';a.rel='noopener'}a.style.position='fixed';a.style.top='-1000px';a.style.left='-1000px';document.body.appendChild(a);try{a.click()}catch(e){toast('Could not open this file. Open the app in Chrome.',8000)}setTimeout(()=>{a.remove();URL.revokeObjectURL(u)},10000)};
  $('#open').onclick=()=>go(false);$('#dlf').onclick=()=>go(true);
  $('#dl').onclick=()=>ask('Delete this file from your phone?',async()=>{try{await fdo('readwrite',s=>s.delete(r.id))}catch(e){}D.lib=D.lib.filter(x=>x.id!==r.id);save();cur=null;render()});
 }
 $('#back').onclick=()=>{cur=null;render()};
 scrollTo(0,0);
}

const PARTNER='Mukuba University',DESIGNER='Steve Chilwa';
$('#dsg').textContent=DESIGNER?'Designed by '+DESIGNER:'';
$('#pn').textContent=PARTNER?'In partnership with '+PARTNER:'';
let seed=null;

const SEN={Mathematics:'Algebra|Functions and graphs|Geometry|Trigonometry|Statistics|Probability|Sets|Matrices|Vectors',Biology:'Cell biology|Nutrition|Transport in living things|Respiration|Reproduction|Genetics and evolution|Ecology|Human health and disease',Chemistry:'Matter and its particles|Atomic structure|Chemical bonding|Acids, bases and salts|Reactions and rates|Electrochemistry|Organic chemistry|Metals and non-metals',Physics:'Mechanics and motion|Energy and work|Heat|Waves, light and sound|Electricity|Magnetism|Atomic and nuclear physics',English:'Comprehension|Summary writing|Essay and letter writing|Grammar and usage|Literature',Geography:'Map reading|Weather and climate|Landforms|Population|Agriculture|Mining|Industry',History:'Pre-colonial Zambia|Colonial rule|Struggle for independence|Post-independence Zambia|World history',Business Studies:'Business environment|Business ownership|Marketing|Finance|Management'};
const JUNIOR={Mathematics:'Sets|Numbers and Numeration|Algebraic Expressions|Geometry|Statistics|Ratio and Proportion|Time and Money',English:'Listening and Speaking|Reading Comprehension|Composition Writing|Grammar: Tenses|Grammar: Parts of Speech|Vocabulary and Spelling',Integrated Science:'Cells and Living Things|Plants|Human Body Systems|Health and Diseases|Matter and Materials|Energy|Forces and Machines|Electricity|Earth and Space|Environment and Conservation','Social Studies':'Zambia History and Independence|Government and Citizenship|Zambia Economy|Map Work|Africa and the World|Family and Community','Zambian Language':'Oral Literature|Reading and Comprehension|Writing|Grammar','Creative and Technology Studies':'Design and Making|Drawing and Painting|Food and Nutrition|Agriculture|Music and Drama|Basic Technology'};

const TOP={
 'Grade 6':JUNIOR,
 'Form 1 (Grade 7)':JUNIOR,
 'Form 2 (Grade 8)':JUNIOR,
 'Form 3 (Grade 9)':JUNIOR,
 'Form 4 (Grade 10)':SEN,
 'Form 5 (Grade 11)':SEN,
 'Form 6 (Grade 12)':SEN
};

let dv={g:(D.pre&&D.pre.g)||'Form 1 (Grade 7)',s:(D.pre&&D.pre.s)||'',t:''};
if(!TOP[dv.g]){dv.g = Object.keys(TOP)[0]; dv.s = '';}

const topics=(g,s)=>((TOP[g]||{})[s]||'').split('|').filter(Boolean).concat(D.ct.filter(x=>x.g===g&&x.s===s).map(x=>x.t));
const opts=(a,sel,ph)=>(ph?'<option value="">'+ph+'</option>':'')+a.map(x=>'<option'+(x===sel?' selected':'')+'>'+esc(x)+'</option>').join('');

function draft(o){
 const t=o.topic||'the topic';
 const sub=(o.subject||'').toLowerCase();
 const tot=parseInt(o.dur)||40;
 const school=o.school||(D.pre&&D.pre.school)||'[School Name]';
 const teacher=o.teacher||(D.pre&&D.pre.teacher)||'[Teacher Name]';
 
 const isMath=/math/.test(sub);
 const isScience=/science|biology|chemistry|physics/.test(sub);
 const isLanguage=/english|language/.test(sub);
 const isSocial=/social|history|geography|civic/.test(sub);
 
 const sh=[.15,.30,.25,.15,.15].map(p=>Math.max(1,Math.round(tot*p)));
 
 let goal, comps, c1, c2, c3, method, af, as, mat, env, prior, inter, cont;
 
 if(isMath){
     goal = 'To develop learners\' ability to accurately solve problems related to '+t+' and apply the concepts in real-life situations.';
     comps = "Mathematical reasoning, problem-solving, critical thinking, analytical skills, and precision.";
     c1 = 'Knowledge based: Identify the key terms, formulas, and rules associated with '+t+'.';
     c2 = 'Cognitive based: Explain the steps involved in solving problems related to '+t+' and justify the solutions.';
     c3 = 'Skill based: Accurately calculate and solve real-world problems involving '+t+'.';
     method = "Guided discovery, step-by-step problem-solving on the board, think-pair-share, and differentiated practice.";
     af = "Observation of learner working out, checking exercise books during practice, and oral questioning.";
     as = "A short written exercise with 3-5 graded problems on the topic.";
     mat = 'Chalkboard, rulers, textbook, and worksheets with practice problems on '+t+'.';
     prior = 'Learners have prior knowledge of basic arithmetic operations and foundational concepts related to '+t+'.';
 } else if(isScience){
     goal = 'To enable learners to understand the scientific principles behind '+t+' through observation and investigation.';
     comps = "Scientific inquiry, observation, data recording, teamwork, and environmental awareness.";
     c1 = 'Knowledge based: State the basic facts, definitions, and processes involved in '+t+'.';
     c2 = 'Cognitive based: Explain the relationship between concepts in '+t+' and predict outcomes of experiments.';
     c3 = 'Skill based: Conduct simple experiments or observations related to '+t+' and record findings accurately.';
     method = "Inquiry-based learning, laboratory/field observation, group experimentation, and guided discussion.";
     af = "Observing group participation, checking how learners record data, and asking probing questions during experiments.";
     as = "A short quiz or a lab report on the findings of the activity.";
     mat = 'Chalkboard, charts, laboratory apparatus (if available), and locally available materials for experiments.';
     prior = 'Learners have encountered everyday phenomena related to '+t+' in their environment.';
 } else if(isLanguage){
     goal = 'To enhance learners\' ability to communicate effectively, comprehend, and construct meaningful texts about '+t+'.';
     comps = "Effective communication, reading comprehension, vocabulary development, and creative writing.";
     c1 = 'Knowledge based: Identify the vocabulary, grammar structures, and themes related to '+t+'.';
     c2 = 'Cognitive based: Analyze texts and construct sentences or paragraphs that correctly apply concepts of '+t+'.';
     c3 = 'Skill based: Demonstrate fluency in speaking and coherence in writing about '+t+'.';
     method = "Communicative language teaching, role-playing, reading aloud, group discussions, and process writing.";
     af = "Listening to learners during role-play/discussion, peer review of written work, and oral quizzes.";
     as = "A written composition or a reading comprehension passage with questions.";
     mat = 'Chalkboard, textbooks, supplementary readers, dictionaries, and flashcards.';
     prior = 'Learners have basic vocabulary and sentence construction skills related to '+t+'.';
 } else if(isSocial){
     goal = 'To help learners understand the social, historical, or geographical significance of '+t+' and their role as citizens.';
     comps = "Civic responsibility, critical thinking, map reading, historical empathy, and cultural appreciation.";
     c1 = 'Knowledge based: Name key events, places, or civic concepts related to '+t+'.';
     c2 = 'Cognitive based: Explain the causes, effects, or significance of '+t+' in the Zambian and global context.';
     c3 = 'Skill based: Interpret maps/charts or engage in debates regarding '+t+'.';
     method = "Discussion, map work, timeline creation, role-play of historical events, and group presentations.";
     af = "Observation during group work, questioning, and checking notes.";
     as = "An open-ended essay question or a map interpretation exercise.";
     mat = 'Chalkboard, maps, historical pictures, textbook, and relevant community resources.';
     prior = 'Learners have an awareness of their community and basic social structures.';
 } else {
     goal = 'To help learners understand and apply the key concepts of '+t+' effectively.';
     comps = "Communication, collaboration, observation, problem solving, and critical thinking.";
     c1 = 'Knowledge based: Identifying and naming the key ideas in '+t+'.';
     c2 = 'Cognitive based: Explaining, comparing, or classifying ideas in '+t+'.';
     c3 = 'Skill based: Applying '+t+' to solve a real problem.';
     method = "Group work, guided discovery, discussion, and demonstration.";
     af = "Observation, monitoring participation, and how well learners work in groups.";
     as = "Open-ended questions and a short written task on " + t + ".";
     mat = 'Chalkboard and chalk, learners\' textbook, charts, or real objects about '+t+'.';
     prior = 'Learners have met basic ideas related to '+t+' in earlier lessons.';
 }
 
 env = "Natural: school surroundings. Artificial: classroom. Technological: videos or charts if available.";
 inter = 'Links to other subjects, such as applying '+t+' in daily life and other disciplines.';
 cont = 'Learners use '+t+' at home or in the community and report back in the next lesson.';

 const act = isMath ? 'solve practice problems step by step' : isScience ? 'observe, test, and record findings' : isLanguage ? 'read, speak, and write using examples' : 'discuss, investigate, and record answers';
 
 const d = {
  school: school, teacher: teacher, goal: goal, competences: comps, target: 'Learners use what they learn about '+t+' correctly in everyday life.',
  c1: c1, c2: c2, c3: c3, method: method, af: af, as: as, mat: mat, env: env, prior: prior, inter: inter, cont: cont
 };
 
 const T={
  eng:['Greet learners. Ask a question that links '+t+' to daily life and review what they already know.', 'Answer questions and share ideas and experiences.', 'Communication, critical thinking', 'Monitor participation and engagement.'],
  exp:['- Introduce the activity.\n- Divide learners into small groups.\n- Give clear instructions and materials.\n- Move around, guide, and ask probing questions.', '- In groups, '+act+' on '+t+'.\n- Record findings.\n- Prepare to present.', 'Collaboration, communication, observation, problem-solving', 'Check that learners work correctly and safely; ask open-ended questions.'],
  xpl:['- Ask groups to present their findings.\n- Explain the key ideas of '+t+' and link them to what learners found.\n- Correct misconceptions.', 'Present findings, give feedback, listen, and take notes.', 'Presentation, critical thinking, note-taking', 'Monitor presentations; ask open-ended questions; check that learners take notes.'],
  syn:['Give concise notes on '+t+': key terms and key points. Show how the ideas apply in other situations.', 'Write notes, make corrections, and give examples from daily life.', 'Critical thinking, creativity, problem-solving', 'Check notes; check that learners apply the ideas correctly.'],
  evl:['1. What was easy or difficult about '+t+'?\n2. How did your group reach agreement?\n- Give feedback on responses.', 'Reflect, answer the questions, and give feedback.', 'Communication, critical thinking, reflection', 'Monitor the discussion; ask open-ended questions.']
 };
 ['eng','exp','xpl','syn','evl'].forEach((k,i)=>{d[k+'D']=String(sh[i]);d[k+'T']=T[k][0];d[k+'L']=T[k][1];d[k+'C']=T[k][2];d[k+'A']=T[k][3]});
 return d;
}

function planBody(o){
 const e=x=>esc(x||'').replace(/\n/g,'<br>');
 const r1=(l,v)=>'<tr><td colspan="5"><b>'+l+':</b> '+e(v)+'</td></tr>';
 let h='<h3>Lesson plan'+(o.school?' - '+e(o.school):'')+'</h3>'+(o.teacher?'<p>Teacher: '+e(o.teacher)+'</p>':'');

 [['Subject','subject'],['Level','cls'],['Concept','concept'],['Sub-concepts','subc'],['Topic','topic'],['Subtopic','subtopic']].forEach(a=>h+=r1(a[0],o[a[1]]));
 h+=r1('Lesson Duration',o.dur?o.dur+' minutes':'')+r1('Time',o.time)+r1('Date',o.date)+r1('Lesson Goal',o.goal)+r1('Competences',o.competences)+r1('Expected Target Competence',o.target);
 h+=r1('Lesson Competencies',[o.c1,o.c2,o.c3].filter(Boolean).join('\n'))+r1('Lesson Methodology and strategies',o.method);
 h+=r1('Assessment Strategies','Formative: '+(o.af||'')+'\nSummative: '+(o.as||''))+r1('Learning Materials',o.mat)+r1('Learning Environment',o.env)+r1('Prior Knowledge',o.prior)+r1('Interdisciplinary Connections',o.inter)+'</table>';
 h+='<table><tr><th colspan="5">Lesson Progression</th></tr><tr><th></th><th>Teacher Activity (acts as facilitator)</th><th>Learner Activity (creates knowledge actively, not passively)</th><th>Targeted Competency</th><th>Assessment Criteria</th></tr>';
 ST.forEach(([k,l])=>h+='<tr><td><b>'+e(l)+'</b><br>[Duration: '+e(o[k+'D'])+' min]</td><td>'+e(o[k+'T'])+'</td><td>'+e(o[k+'L'])+'</td><td>'+e(o[k+'C'])+'</td><td>'+e(o[k+'A'])+'</td></tr>');

function stats(m,c){
 const t=+m.total||0,v=c.L.map(l=>({n:l.n,g:l.s,s:m.scores[l.id]})).filter(x=>x.s!==''&&x.s!=null&&!isNaN(x.s));
 if(!v.length||!t)return null;
 const p=v.map(x=>({n:x.n,g:x.g,p:Math.round(+x.s/t*100)})),pass=+m.pass||50,low=p.filter(x=>x.p<pass).sort((a,b)=>a.p-b.p),sr=p.slice().sort((a,b)=>b.p-a.p);
 const ga=g=>{const a=p.filter(x=>x.g===g);return a.length?Math.round(a.reduce((q,x)=>q+x.p,0)/a.length):null};
 return{n:p.length,avg:Math.round(p.reduce((a,x)=>a+x.p,0)/p.length),rate:pct(p.length-low.length,p.length),hi:sr[0],lo:sr[sr.length-1],low,pass,b:ga('M'),g:ga('F')};
}

 '<h3>Assessments</h3>'+(ms.length?ms.map(m=>{const s=stats(m,c);return '<div class="card" data-id="'+m.id+'"><b>'+esc(m.title)+'</b><small>'+esc([m.date,m.topic,s?'Average '+s.avg+'%, pass rate '+s.rate+'%':'No marks yet'].filter(Boolean).join(', '))+'</small></div>'}).join(''):'<p class="empty">No assessments yet.</p>');

 const all=[].concat.apply([],Object.keys(TOP[c.g]||{}).map(sb=>topics(c.g,sb)));
 $('#app').innerHTML='<button class="link" id="b">Back to marks</button><h2>'+(isNew?'New':'Edit')+' assessment</h2>'+
 '<label>Title<input id="mt" placeholder="For example, End of topic test" value="'+esc(m.title)+'"></label><label>Subject<input id="ms" list="sl" value="'+esc(m.subject)+'"></label><datalist id="sl">'+Object.keys(TOP[c.g]||{}).map(x=>'<option>'+esc(x)+'</option>').join('')+'</datalist>'+
 '<label>Topic<input id="mp" list="tl" value="'+esc(m.topic)+'"></label><datalist id="tl">'+all.map(x=>'<option>'+esc(x)+'</option>').join('')+'</datalist>'+
 '<label>Total marks<input id="mo" type="number" inputmode="decimal" value="'+esc(m.total)+'"></label><label>Pass mark (percent)<input id="mq" type="number" inputmode="decimal" value="'+esc(m.pass)+'"></label><label>Date<input id="md" type="date" value="'+esc(m.date)+'"></label>'+
 '<h2>Scores</h2>'+groups(c).map(([t,L])=>'<h3>'+t+' ('+L.length+')</h3><div class="reg">'+L.map((l,i)=>'<div><span class="rn">'+(i+1)+'.</span><span class="nm">'+esc(l.n)+'</span><input type="number" inputmode="decimal" data-l="'+l.id+'" value="'+esc(m.scores[l.id]==null?'':m.scores[l.id])+'"></div>').join('')+'</div>').join('')+
 '<h3>Analysis</h3><div id="an"></div><div class="row"><button class="pri" id="sv">Save</button>'+(isNew?'':'<button class="del" id="dl">Delete</button>')+'</div>';
 const rd=()=>{const o=Object.assign({},m,{title:$('#mt').value.trim(),subject:$('#ms').value.trim(),topic:$('#mp').value.trim(),total:$('#mo').value,pass:$('#mq').value,date:$('#md').value,scores:{}});document.querySelectorAll('[data-l]').forEach(e=>{if(e.value!=='')o.scores[e.dataset.l]=e.value});return o};
 const an=()=>{const s=stats(rd(),c);$('#an').innerHTML=s?'<div class="card"><b>Class average: '+s.avg+'%</b><small>Pass rate '+s.rate+'% ('+s.n+' learners marked). Highest: '+esc(s.hi.n)+' '+s.hi.p+'%. Lowest: '+esc(s.lo.n)+' '+s.lo.p+'%.'+(s.b!=null&&s.g!=null?' Boys average '+s.b+'%, girls average '+s.g+'%.':'')+'</small></div>'+(s.low.length?'<div class="card"><b>Below '+s.pass+'%: needs support</b><small>'+s.low.map(x=>esc(x.n)+' '+x.p+'%').join(', ')+'</small></div>':''):'<p class="empty">Enter the total marks and some scores to see the analysis.</p>'};
 document.querySelectorAll('#app input').forEach(e=>e.oninput=an);an();
 $('#b').onclick=()=>{K.sec='M';render()};
 $('#sv').onclick=()=>{const o=rd();
  if(!o.title){toast('Type a title first.');return}
  if(!(+o.total>0)){toast('Enter the total marks first.');return}
  if(Object.values(o.scores).some(v=>+v>+o.total||+v<0)){toast('A score is higher than the total marks, or below zero. Please check.');return}
  if(isNew)D.marks.push(o);else D.marks[D.marks.findIndex(x=>x.id===m.id)]=o;
  save();toast('Saved.');K.sec='M';render()};
 if(!isNew)$('#dl').onclick=()=>ask('Delete this assessment and its scores?',()=>{D.marks=D.marks.filter(x=>x.id!==m.id);save();K.sec='M';render()});
}
function attV(c){
 D.att[c.id]=D.att[c.id]||{};const A=D.att[c.id];
 let dt=today(),ab=new Set(A[dt]||[]);
 $('#app').innerHTML='<button class="link" id="b">Back</button><h2>Attendance</h2><label>Date<input id="dt" type="date" value="'+dt+'"></label><p>Tick the box if a learner is absent.</p><div id="list"></div><div class="row"><button class="pri" id="sv">Save attendance</button></div><div id="sm"></div>';
 const sum=()=>{const days=Object.keys(A);if(!days.length){$('#sm').innerHTML='';return}
  const r=c.L.map(l=>{const a=days.filter(d=>A[d].indexOf(l.id)>-1).length;return{n:l.n,g:l.s==='M'?'Boy':l.s==='F'?'Girl':'',p:pct(days.length-a,days.length),a}}).sort((x,y)=>x.p-y.p);
  $('#sm').innerHTML='<h3>Summary ('+days.length+' days recorded)</h3><div class="reg">'+r.map(x=>'<div><span class="nm">'+esc(x.n)+(x.g?' ('+x.g+')':'')+'</span><span>'+x.p+'% present'+(x.p<80?' - follow up':'')+'</span></div>').join('')+'</div>'};
 const drawSummary=()=>{
  const bA=c.L.filter(l=>l.s==='M'&&ab.has(l.id)).length,gA=c.L.filter(l=>l.s==='F'&&ab.has(l.id)).length;
  let el=document.getElementById('absent-summary');
  if(el) el.innerHTML='<p><b>Absent today: '+ab.size+'</b> (boys '+bA+', girls '+gA+')</p>';
 };
 const draw=()=>{
  $('#list').innerHTML=(groups(c).map(([t,L])=>'<h3>'+t+' ('+L.length+')</h3><div class="reg">'+L.map((l,i)=>'<div><span class="rn">'+(i+1)+'.</span><span class="nm">'+esc(l.n)+'</span><label style="display:flex;align-items:center;gap:6px;font-size:14px;color:var(--red);cursor:pointer;margin:0;"><input type="checkbox" data-a="'+l.id+'" style="width:20px;height:20px;margin:0;" '+(ab.has(l.id)?'checked':'')+'> Absent</label></div>').join('')+'</div>').join('')||'<p class="empty">Add learners first.</p>')+'<div id="absent-summary"></div>';
  drawSummary();
  document.querySelectorAll('[data-a]').forEach(cb=>cb.onchange=()=>{
      const i=cb.dataset.a;
      cb.checked?ab.add(i):ab.delete(i);
      drawSummary();
  })};
 $('#dt').onchange=e=>{dt=e.target.value;ab=new Set(A[dt]||[]);draw()};
 $('#sv').onclick=()=>{if(!dt){toast('Choose a date first.');return}A[dt]=Array.from(ab);save();sum();toast('Saved for '+dt+'. Absent: '+ab.size)};
 bk();draw();sum();
}
function covV(c){
 const subs=Object.keys(TOP[c.g]||{});let sb=K.sb&&subs.indexOf(K.sb)>-1?K.sb:subs[0];
 $('#app').innerHTML='<button class="link" id="b">Back</button><h2>Syllabus coverage</h2><label>Subject<select id="cs">'+opts(subs,sb)+'</select></label><div id="cv"></div><p class="empty">Topics come from the starter lists. Add your own on the Daniel tab with Save my topic.</p>';
 const draw=()=>{const key=c.id+'|'+sb,done=new Set(D.cov[key]||[]),tp=topics(c.g,sb),n=tp.filter(t=>done.has(t)).length;
  $('#cv').innerHTML='<p><b>'+n+' of '+tp.length+' topics covered ('+pct(n,tp.length)+'%)</b></p><div class="bar2"><i style="width:'+pct(n,tp.length)+'%"></i></div>'+tp.map(t=>'<label style="display:flex;gap:10px;align-items:center;color:var(--tx)"><input type="checkbox" style="width:auto" data-tp="'+esc(t)+'"'+(done.has(t)?' checked':'')+'>'+esc(t)+'</label>').join('');
  document.querySelectorAll('[data-tp]').forEach(x=>x.onchange=()=>{x.checked?done.add(x.dataset.tp):done.delete(x.dataset.tp);D.cov[key]=Array.from(done);save();draw()})};
 $('#cs').onchange=e=>{sb=e.target.value;K.sb=sb;draw()};
 bk();draw();
}
function more(){
 $('#app').innerHTML='<h2>More</h2><div class="grid"><button id="mn">Notes</button><button id="mb">Backup and restore</button></div><div id="bx"></div><p class="empty">Tip: for downloads, printing and adding files, open this app in Chrome.</p>';
 $('#mn').onclick=()=>{tab='notes';cur=null;q='';render()};
 $('#mb').onclick=backup;
}
function backup(){
 $('#bx').innerHTML='<h3>Backup and restore</h3><p>A backup holds your lesson plans, schemes, notes, classes, marks, attendance and coverage. Library files are not included. Keep the file somewhere safe, for example by sending it to yourself on WhatsApp.</p><div class="row"><button class="pri" id="bkb">Download backup</button></div><label>Restore from a backup file<input id="rf" type="file"></label>';
 $('#bkb').onclick=()=>{try{const B=Object.assign({},D);delete B.lib;const blob=new Blob([JSON.stringify(B)],{type:'application/json'});if(downloadBlob(blob,'zm-planner-backup-'+today()+'.json'))toast('Backup file created. Look in your Downloads folder.',6000)}catch(e){toast('Could not create the backup: '+(e&&e.message||e),8000)}};
 $('#rf').onchange=async e=>{const f=e.target.files[0];if(!f)return;
  let o;try{o=JSON.parse(await f.text());if(!o||!Array.isArray(o.plans))throw 0}catch(x){toast('That file is not a ZM Planner backup.');return}
  ask('Restoring replaces everything now in the app (except Library files) with this backup. Continue?',()=>{D=Object.assign({plans:[],scheme:[],notes:[],ct:[],classes:[],marks:[],att:{},cov:{},pre:{}},o,{lib:D.lib});save();toast('Backup restored.');tab='plans';cur=null;render()})};
}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;cur=null;q='';render()});
render();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
